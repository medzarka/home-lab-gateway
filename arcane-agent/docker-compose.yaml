services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/arcane-headless:latest
    container_name: arcane-agent
    restart: unless-stopped
    environment:
      - ARCANE_SERVER_URL=${ARCANE_SERVER_URL:-https://homelab-dockhand.bluewave.work}
      - ARCANE_AGENT_TOKEN=${ARCANE_AGENT_TOKEN}
      - ARCANE_AGENT_NAME=${ARCANE_AGENT_NAME:-$(hostname)}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
