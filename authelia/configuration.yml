---
# ==============================================================================
# AUTHELIA CONFIGURATION (https://www.authelia.com/configuration/)
# ==============================================================================

server:
  address: "tcp://0.0.0.0:9091"
  asset_path: "/config/assets"
  buffers:
    read: 65536
    write: 65536

log:
  level: "info"

theme: "dark"

regulation:
  max_retries: 10
  find_time: "2m"
  ban_time: "5m"

identity_validation:
  reset_password:
    jwt_secret: "d990cd84cd49d8264cc6962552f30cc30e9d9388a2f9382bf8bfd61dc458ea06"

authentication_backend:
  file:
    path: "/config/users_database.yml"
    password:
      algorithm: "argon2"

session:
  name: "authelia_session"
  secret: "88e41276bc5fd92ee8d638c9ed85e0cddfef274fe7165a6914a841b2f9d536ea"
  expiration: "1w"
  inactivity: "24h"
  remember_me: "1w"
  cookies:
    - domain: "bluewave.work"
      authelia_url: "https://auth.bluewave.work"
      default_redirection_url: "https://homelab.bluewave.work"

totp:
  issuer: "Bluewave Homelab"
  period: 30
  skew: 1

storage:
  encryption_key: "74f4ff3849ef73c3f3545cfd214a58bf0ed376250da6cdb32e458bf5d27e33aa"
  local:
    path: "/config/data/db.sqlite3"

notifier:
  filesystem:
    filename: "/config/data/notification.txt"

access_control:
  default_policy: "deny"
  rules:
    # --------------------------------------------------------------------------
    # 1. Public Endpoints & APIs (Bypass SSO)
    # --------------------------------------------------------------------------
    - domain: "auth.bluewave.work"
      policy: "bypass"

    - domain:
        - "photos.bluewave.work"
        - "mycloud.bluewave.work"
        - "seafile.bluewave.work"
      resources:
        - "^/api/.*$"
        - "^/api2/.*$"
        - "^/seafhttp/.*$"
      policy: "bypass"

    # --------------------------------------------------------------------------
    # 2. Portal & Dashboards (1-Factor: Username + Password)
    # --------------------------------------------------------------------------
    - domain:
        - "homelab.bluewave.work"
        - "hub.bluewave.work"
        - "logs.bluewave.work"
        - "status.bluewave.work"
      policy: "one_factor"

    # --------------------------------------------------------------------------
    # 3. Critical Infrastructure Cockpits (2-Factor: Password + TOTP 2FA)
    # --------------------------------------------------------------------------
    - domain:
        - "traefik.bluewave.work"
        - "metrics.bluewave.work"
        - "beszel.bluewave.work"
        - "arcane.bluewave.work"
      policy: "two_factor"
