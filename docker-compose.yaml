services:

  # ========================================================
  # INITIALIZATION SERVICE (Automated Host Storage Setup)
  # ========================================================
  init-volumes:
    image: alpine:latest
    container_name: gateway_init_volumes
    user: "0:0"
    restart: "no"
    network_mode: none
    volumes:
      - ${GATEWAY_HOME:-/srv/data/gateway}:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Init] Initializing Traefik and GoAccess directories..."
        mkdir -p /data/volumes/traefik/dynamic /data/volumes/traefik/logs /data/volumes/traefik/html
        touch /data/volumes/traefik/acme.json /data/volumes/traefik/logs/access.log
        chmod 600 /data/volumes/traefik/acme.json
        chmod -R 775 /data/volumes
        echo ">>> [Init] Gateway storage initialized successfully!"

  # ========================================================
  # DOCKER SOCKET PROXY (Read-Only Secure Socket Isolation)
  # ========================================================
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: gateway_socket_proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - NETWORKS=1
      - NODES=1
      - SWARM=1
      - INFO=1
      - VERSION=1
      - EVENTS=1
      - PING=1
      - POST=0
      - DELETE=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_proxy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # TRAEFIK V3 (Edge Ingress & Fail2Ban Protection)
  # ========================================================
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ${GATEWAY_HOME:-/srv/data/gateway}/volumes/traefik/acme.json:/etc/traefik/acme.json
      - ./dynamic:/etc/traefik/dynamic:ro
      - ${GATEWAY_HOME:-/srv/data/gateway}/volumes/traefik/logs:/var/log/traefik
    command:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--api.dashboard=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.http.tls.certResolver=cloudflare"
      - "--entryPoints.websecure.http.tls.domains[0].main=${ROOT_DOMAIN:-bluewave.work}"
      - "--entryPoints.websecure.http.tls.domains[0].sans=*.${ROOT_DOMAIN:-bluewave.work}"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=homelab_swarm_net"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53"
      - "--certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.cloudflare.acme.storage=/etc/traefik/acme.json"
      - "--experimental.plugins.fail2ban.modulename=github.com/tomMoulard/fail2ban"
      - "--experimental.plugins.fail2ban.version=v0.9.0"
      - "--metrics.prometheus=true"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--log.level=INFO"
    networks:
      - homelab_swarm_net
      - shared_net
      - socket_proxy
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      socket-proxy:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # GOACCESS LOG ANALYZER (Real-Time Metrics Engine)
  # ========================================================
  goaccess:
    image: allinurl/goaccess:latest
    container_name: gateway_goaccess
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    command:
      - "/var/log/traefik/access.log"
      - "-o"
      - "/var/www/html/index.html"
      - "--log-format=%h %^ %e [%d:%t %^] \"%r\" %s %b \"%R\" \"%u\" %^ \"%v\" %^ %Tms"
      - "--date-format=%d/%b/%Y"
      - "--time-format=%T"
      - "--real-time-html"
      - "--ws-url=wss://traffic.${ROOT_DOMAIN:-bluewave.work}:443/ws"
      - "--origin=https://traffic.${ROOT_DOMAIN:-bluewave.work}"
      - "--port=443"
      - "--addr=0.0.0.0"
    volumes:
      - ${GATEWAY_HOME:-/srv/data/gateway}/volumes/traefik/logs:/var/log/traefik:ro
      - ${GATEWAY_HOME:-/srv/data/gateway}/volumes/traefik/html:/var/www/html
    networks:
      - shared_net
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  # ========================================================
  # GOACCESS WEB SERVER (HTML Report Server)
  # ========================================================
  traffic-web:
    image: nginx:alpine
    container_name: gateway_traffic_web
    restart: unless-stopped
    volumes:
      - ${GATEWAY_HOME:-/srv/data/gateway}/volumes/traefik/html:/usr/share/nginx/html:ro
    networks:
      - shared_net
    depends_on:
      init-volumes:
        condition: service_completed_successfully

networks:
  homelab_swarm_net:
    name: homelab_swarm_net
    external: true
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
    external: true
  socket_proxy:
    name: gateway_socket_proxy_net
    internal: true
