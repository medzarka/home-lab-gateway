services:

  # ========================================================
  # STORAGE HELPER (Automated Directory & Permissions Guard)
  # ========================================================
  storage-init:
    image: alpine:latest
    container_name: gateway_storage_init
    user: "0:0"
    restart: unless-stopped
    network_mode: none
    volumes:
      - ${DATA_DIR:-/home/mgrsys/DATA}/gateway/data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Storage Init] Setting up directories and permissions..."
        mkdir -p /data/traefik/logs /data/authelia
        touch /data/traefik/acme.json /data/traefik/logs/access.log
        chmod -R 775 /data
        chmod 600 /data/traefik/acme.json
        echo ">>> [Storage Init] Permissions applied. Storage guard active."
        sleep infinity

  # ========================================================
  # DOCKER SOCKET PROXY (Read-Only Secure Socket Isolation)
  # ========================================================
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: gateway_socket_proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - NETWORKS=1
      - NODES=1
      - SWARM=1
      - INFO=1
      - VERSION=1
      - EVENTS=1
      - PING=1
      - POST=0
      - DELETE=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_proxy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # AUTHELIA (Centralized SSO & 2FA Authentication Server)
  # ========================================================
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml:ro
      - ./authelia/assets:/config/assets:ro
      - ${DATA_DIR:-/home/mgrsys/DATA}/gateway/data/authelia:/config/data
    environment:
      - TZ=${TZ:-UTC}
      - AUTHELIA_SESSION_COOKIES_0_DOMAIN=${ROOT_DOMAIN:-example.com}
      - AUTHELIA_SESSION_COOKIES_0_AUTHELIA_URL=https://auth.${ROOT_DOMAIN:-example.com}
      - AUTHELIA_SESSION_COOKIES_0_DEFAULT_REDIRECTION_URL=https://homelab.${ROOT_DOMAIN:-example.com}
      - AUTHELIA_TOTP_ISSUER=${ROOT_DOMAIN:-Homelab SSO}
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.authelia-sso.forwardauth.address=http://authelia:9091/api/verify?rd=https%3A%2F%2Fauth.${ROOT_DOMAIN:-example.com}%2F"
      - "traefik.http.middlewares.authelia-sso.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia-sso.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"
    networks:
      - shared_net
      - homelab_swarm_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # TRAEFIK V3 (Edge Ingress, SSL & Fail2Ban Protection)
  # ========================================================
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CF_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - ACME_EMAIL=${ACME_EMAIL}
      - DOCKER_API_VERSION=1.45
    volumes:
      - ${DATA_DIR:-/home/mgrsys/DATA}/gateway/data/traefik/acme.json:/etc/traefik/acme.json
      - ${DATA_DIR:-/home/mgrsys/DATA}/gateway/data/traefik/logs:/var/log/traefik
      - ./dynamic:/etc/traefik/dynamic:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "worker-oci01:${TS_VM2_OCI01:-127.0.0.1}"
      - "worker-orangepi:${TS_VM3_ORANGEPI:-127.0.0.1}"
    command:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--api.dashboard=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.http.tls.certResolver=cloudflare"
      - "--entryPoints.websecure.http.tls.domains[0].main=${ROOT_DOMAIN:-example.com}"
      - "--entryPoints.websecure.http.tls.domains[0].sans=*.${ROOT_DOMAIN:-example.com}"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53"
      - "--certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.cloudflare.acme.storage=/etc/traefik/acme.json"
      - "--experimental.plugins.fail2ban.modulename=github.com/tomMoulard/fail2ban"
      - "--experimental.plugins.fail2ban.version=v0.9.0"
      - "--metrics.prometheus=true"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--log.level=INFO"
    networks:
      - homelab_swarm_net
      - shared_net
      - socket_proxy
    depends_on:
      socket-proxy:
        condition: service_healthy
      authelia:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  homelab_swarm_net:
    name: homelab_swarm_net
    external: true
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
    external: true
  socket_proxy:
    name: gateway_socket_proxy_net
    internal: true
