services:

  # ========================================================
  # INITIALIZATION SERVICE (Automated Host Storage Setup)
  # ========================================================
  init-volumes:
    image: alpine:latest
    container_name: gateway_init_volumes
    user: "0:0"
    restart: "no"
    volumes:
      - ${GATEWAY_HOME:-/srv/data/gateway}:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Init] Creating gateway storage directories under /data..."
        mkdir -p /data/volumes/tailscale /data/volumes/traefik

        echo ">>> [Init] Setting volume permissions..."
        chmod -R 775 /data/volumes

        echo ">>> [Init] Gateway storage initialized successfully!"

  # ========================================================
  # TAILSCALE (Secure Mesh Gateway & Network Namespace Carrier)
  # ========================================================
  tailscale:
    image: tailscale/tailscale:latest
    container_name: gateway_tailscale
    hostname: ${TS_HOSTNAME:-homelab-gw}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ${GATEWAY_HOME:-/srv/data/gateway}/volumes/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    networks:
      - shared_net
      - socket_proxy
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "tailscale status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # DOCKER SOCKET PROXY (Read-Only Secure Socket Isolation)
  # ========================================================
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: gateway_socket_proxy
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - NETWORKS=1
      - EVENTS=1
      - PING=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # TRAEFIK V3 (Reverse Proxy & Ingress Controller)
  # ========================================================
  traefik:
    image: traefik:v3
    container_name: gateway_traefik
    network_mode: service:tailscale
    depends_on:
      - socket-proxy
      - tailscale
    command:
      - --ping=true
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    volumes:
      - ${GATEWAY_HOME:-/srv/data/gateway}/volumes/traefik:/data
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # CLOUDFLARE TUNNEL (Zero Trust Outbound Ingress)
  # ========================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gateway_cloudflared
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$TUNNEL_TOKEN" ]; then
          echo "[cloudflared] No CLOUDFLARE_TUNNEL_TOKEN configured. Idling safely..."
          exec sleep infinity
        else
          echo "[cloudflared] Starting Cloudflare tunnel..."
          exec cloudflared tunnel --metrics 0.0.0.0:2000 --no-autoupdate run
        fi
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - TUNNEL_METRICS=0.0.0.0:2000
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$TUNNEL_TOKEN\" ]; then exit 0; fi; (wget -q -O - http://127.0.0.1:2000/ready >/dev/null 2>&1 || curl -s -f http://127.0.0.1:2000/ready >/dev/null 2>&1 || pidof cloudflared >/dev/null 2>&1 || exit 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - shared_net
    depends_on:
      - tailscale
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
  socket_proxy:
    internal: true
