http:
  routers:
    # ----------------------------------------------------
    # GoAccess WebSocket Live Feed (Real-Time Metrics Stream)
    # ----------------------------------------------------
    traffic-ws:
      rule: "Host(`traffic.bluewave.work`) && (PathPrefix(`/ws`) || Header(`Upgrade`, `websocket`))"
      entryPoints: ["websecure"]
      service: "traffic-ws-svc"
      priority: 50
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # GoAccess HTML Web Report
    # ----------------------------------------------------
    traffic:
      rule: "Host(`traffic.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["traefik-auth", "security-headers"]
      service: "traffic-web-svc"
      priority: 10
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Traefik Web Dashboard & Visual Monitoring GUI
    # ----------------------------------------------------
    traefik-dashboard:
      rule: "Host(`traefik.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["traefik-auth", "app-fail2ban", "security-headers", "compression"]
      service: "api@internal"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Shortcut: /arcane -> Dedicated Arcane Domain
    # ----------------------------------------------------
    arcane-redirect:
      rule: "Host(`homelab.bluewave.work`) && (Path(`/arcane`) || PathPrefix(`/arcane/`))"
      entryPoints: ["websecure"]
      middlewares: ["to-arcane-domain"]
      service: "noop@internal"
      priority: 100
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Homelab Control Portal (SQLite Dashboard on Orange Pi)
    # ----------------------------------------------------
    homelab-dashboard:
      rule: "Host(`homelab.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "dashboard-svc"
      priority: 10
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Arcane Docker Management Cockpit (VM1: zap-vps)
    # ----------------------------------------------------
    arcane:
      rule: "Host(`arcane.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "arcane-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # LiteLLM AI Gateway (VM2: oci01-flex)
    # ----------------------------------------------------
    litellm:
      rule: "Host(`litellm.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "litellm-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Open-WebUI (VM2: oci01-flex)
    # ----------------------------------------------------
    open-webui:
      rule: "Host(`open-webui.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "openwebui-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # LiteLLM Helper (VM2: oci01-flex)
    # ----------------------------------------------------
    litellm-helper:
      rule: "Host(`litellm-helper.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "litellmhelper-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Seafile (VM1: zap-vps)
    # ----------------------------------------------------
    seafile:
      rule: "Host(`mycloud.bluewave.work`) || Host(`seafile.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "seafile-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Immich Photo Library (VM1: zap-vps)
    # ----------------------------------------------------
    immich:
      rule: "Host(`photos.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "immich-svc"
      tls:
        certResolver: "cloudflare"

  services:
    noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:80"
    traffic-web-svc:
      loadBalancer:
        servers:
          - url: "http://traffic_web:80"
    traffic-ws-svc:
      loadBalancer:
        servers:
          - url: "http://goaccess:443"
    dashboard-svc:
      loadBalancer:
        servers:
          - url: "http://100.71.154.78:8085"
    arcane-svc:
      loadBalancer:
        servers:
          - url: "http://100.119.246.120:3552"
    litellm-svc:
      loadBalancer:
        servers:
          - url: "http://100.83.191.68:4000"
    openwebui-svc:
      loadBalancer:
        servers:
          - url: "http://100.83.191.68:3030"
    litellmhelper-svc:
      loadBalancer:
        servers:
          - url: "http://100.83.191.68:5001"
    seafile-svc:
      loadBalancer:
        servers:
          - url: "http://seafile:80"
    immich-svc:
      loadBalancer:
        servers:
          - url: "http://immich_server:2283"
