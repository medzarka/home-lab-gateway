http:
  routers:
    # ----------------------------------------------------
    # Authelia - Centralized SSO Authentication Portal
    # ----------------------------------------------------
    authelia:
      rule: "HostRegexp(`auth.{domain:.+}`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "authelia-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Homepage - Unified Homelab Portal & Service Cockpit (SSO Protected)
    # ----------------------------------------------------
    homepage:
      rule: "HostRegexp(`(homelab|hub).{domain:.+}`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers", "compression"]
      service: "homepage-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Beszel - Cluster Telemetry & Bandwidth Metrics (SSO 2FA Protected)
    # ----------------------------------------------------
    beszel:
      rule: "HostRegexp(`(metrics|beszel).{domain:.+}`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers", "compression"]
      service: "beszel-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Dozzle - Centralized Multi-Node Container Log Viewer (SSO Protected)
    # ----------------------------------------------------
    dozzle:
      rule: "HostRegexp(`logs.{domain:.+}`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers"]
      service: "dozzle-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Uptime Kuma - Multi-Node Status & Health Alerts
    # ----------------------------------------------------
    uptime-kuma:
      rule: "HostRegexp(`status.{domain:.+}`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "uptimekuma-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Traefik Web Dashboard & Visual Monitoring GUI (SSO 2FA Protected)
    # ----------------------------------------------------
    traefik-dashboard:
      rule: "HostRegexp(`traefik.{domain:.+}`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers", "compression"]
      service: "api@internal"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Shortcut: /arcane -> Dedicated Arcane Domain
    # ----------------------------------------------------
    arcane-redirect:
      rule: "HostRegexp(`(homelab|hub).{domain:.+}`) && (Path(`/arcane`) || PathPrefix(`/arcane/`))"
      entryPoints: ["websecure"]
      middlewares: ["to-arcane-domain"]
      service: "noop@internal"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Arcane Docker Management Cockpit (VM1: zap-vps)
    # ----------------------------------------------------
    arcane:
      rule: "HostRegexp(`arcane.{domain:.+}`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "arcane-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # LiteLLM AI Gateway (VM2: oci01-flex)
    # ----------------------------------------------------
    litellm:
      rule: "HostRegexp(`litellm.{domain:.+}`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "litellm-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Open-WebUI (VM2: oci01-flex)
    # ----------------------------------------------------
    open-webui:
      rule: "HostRegexp(`open-webui.{domain:.+}`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "openwebui-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # LiteLLM Helper (VM2: oci01-flex)
    # ----------------------------------------------------
    litellm-helper:
      rule: "HostRegexp(`litellm-helper.{domain:.+}`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "litellmhelper-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Seafile (VM1: zap-vps)
    # ----------------------------------------------------
    seafile:
      rule: "HostRegexp(`(mycloud|seafile).{domain:.+}`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "seafile-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Immich Photo Library (VM1: zap-vps)
    # ----------------------------------------------------
    immich:
      rule: "HostRegexp(`photos.{domain:.+}`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "immich-svc"
      tls:
        certResolver: "cloudflare"

  services:
    noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:80"
    authelia-svc:
      loadBalancer:
        servers:
          - url: "http://authelia:9091"

    homepage-svc:
      loadBalancer:
        servers:
          - url: "http://homepage:3000"

    beszel-svc:
      loadBalancer:
        servers:
          - url: "http://beszel:8090"

    dozzle-svc:
      loadBalancer:
        servers:
          - url: "http://dozzle:8080"

    uptimekuma-svc:
      loadBalancer:
        servers:
          - url: "http://uptime_kuma:3001"

    arcane-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3552"

    litellm-svc:
      loadBalancer:
        servers:
          - url: "http://worker-oci01:4000"

    openwebui-svc:
      loadBalancer:
        servers:
          - url: "http://worker-oci01:3030"

    litellmhelper-svc:
      loadBalancer:
        servers:
          - url: "http://worker-oci01:5001"

    seafile-svc:
      loadBalancer:
        servers:
          - url: "http://seafile:80"

    immich-svc:
      loadBalancer:
        servers:
          - url: "http://immich_server:2283"
