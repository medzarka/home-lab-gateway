http:
  routers:
    # ----------------------------------------------------
    # Authelia - Centralized SSO Authentication Portal
    # ----------------------------------------------------
    authelia:
      rule: "Host(`auth.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "authelia-svc"
      priority: 100
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Homepage - Unified Homelab Portal & Service Cockpit (SSO Protected)
    # ----------------------------------------------------
    homepage:
      rule: "Host(`homelab.bluewave.work`) || Host(`hub.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers", "compression"]
      service: "homepage-svc"
      priority: 20
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Beszel - Cluster Telemetry & Bandwidth Metrics (SSO 2FA Protected)
    # ----------------------------------------------------
    beszel:
      rule: "Host(`metrics.bluewave.work`) || Host(`beszel.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers", "compression"]
      service: "beszel-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Dozzle - Centralized Multi-Node Container Log Viewer (SSO Protected)
    # ----------------------------------------------------
    dozzle:
      rule: "Host(`logs.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers"]
      service: "dozzle-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Uptime Kuma - Multi-Node Status & Health Alerts
    # ----------------------------------------------------
    uptime-kuma:
      rule: "Host(`status.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "uptimekuma-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Traefik Web Dashboard & Visual Monitoring GUI (SSO 2FA Protected)
    # ----------------------------------------------------
    traefik-dashboard:
      rule: "Host(`traefik.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers", "compression"]
      service: "api@internal"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Shortcut: /arcane -> Dedicated Arcane Domain
    # ----------------------------------------------------
    arcane-redirect:
      rule: "Host(`homelab.bluewave.work`) && (Path(`/arcane`) || PathPrefix(`/arcane/`))"
      entryPoints: ["websecure"]
      middlewares: ["to-arcane-domain"]
      service: "noop@internal"
      priority: 100
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Arcane Docker Management Cockpit (VM1: zap-vps)
    # ----------------------------------------------------
    arcane:
      rule: "Host(`arcane.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "arcane-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # LiteLLM AI Gateway (VM2: oci01-flex)
    # ----------------------------------------------------
    litellm:
      rule: "Host(`litellm.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "litellm-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Open-WebUI (VM2: oci01-flex)
    # ----------------------------------------------------
    open-webui:
      rule: "Host(`open-webui.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "openwebui-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # LiteLLM Helper (VM2: oci01-flex)
    # ----------------------------------------------------
    litellm-helper:
      rule: "Host(`litellm-helper.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "litellmhelper-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Seafile (VM1: zap-vps)
    # ----------------------------------------------------
    seafile:
      rule: "Host(`mycloud.bluewave.work`) || Host(`seafile.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "seafile-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Immich Photo Library (VM1: zap-vps)
    # ----------------------------------------------------
    immich:
      rule: "Host(`photos.bluewave.work`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "immich-svc"
      tls:
        certResolver: "cloudflare"

  services:
    noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:80"
    authelia-svc:
      loadBalancer:
        servers:
          - url: "http://authelia:9091"
    homepage-svc:
      loadBalancer:
        servers:
          - url: "http://homepage:3000"
    beszel-svc:
      loadBalancer:
        servers:
          - url: "http://beszel:8090"
    dozzle-svc:
      loadBalancer:
        servers:
          - url: "http://dozzle:8080"
    uptimekuma-svc:
      loadBalancer:
        servers:
          - url: "http://uptime-kuma:3001"
    arcane-svc:
      loadBalancer:
        servers:
          - url: "http://100.119.246.120:3552"
    litellm-svc:
      loadBalancer:
        servers:
          - url: "http://100.83.191.68:4000"
    openwebui-svc:
      loadBalancer:
        servers:
          - url: "http://100.83.191.68:3030"
    litellmhelper-svc:
      loadBalancer:
        servers:
          - url: "http://100.83.191.68:5001"
    seafile-svc:
      loadBalancer:
        servers:
          - url: "http://seafile:80"
    immich-svc:
      loadBalancer:
        servers:
          - url: "http://immich_server:2283"
